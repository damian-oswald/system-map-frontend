name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # the site lives under /system-map-frontend/ on github.io
      - run: npx ng build --base-href /system-map-frontend/

      # single-page app: let GitHub Pages serve the app for any deep link
      - run: cp dist/system-map-frontend/browser/index.html dist/system-map-frontend/browser/404.html

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/system-map-frontend/browser
          publish_branch: gh-pages
          force_orphan: true
